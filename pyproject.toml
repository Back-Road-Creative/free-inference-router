[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-inference-router"
version = "0.1.0"
description = "Deterministic lane selector and zero-spend guard rails for free remote LLM providers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Back Road Creative" }]
# Deliberately dependency-free, like the local-agent lane: the router is a security
# boundary (it decides what leaves the machine), so every third-party package
# is another thing to audit and another offline failure mode.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov", "ruff>=0.4.0", "mypy>=1.0.0", "hypothesis>=6.100"]
# Offline evaluation only (JP decision D1, 2026-09-22): router/decide.py's
# OnnxLayaScorer imports onnxruntime lazily and only when instantiated, so
# this extra is opt-in and never required by `dependencies` above -- the
# router stays a dependency-free security boundary.
laya = ["onnxruntime>=1.16.0", "tokenizers>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["router", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=router"
