# tinyproxy config — the ONLY network egress path for the Bifrost gateway.
# Two INDEPENDENT controls, do not confuse them:
#
#   1. Client ACL (`Allow`) — which CLIENTS may use this proxy at all,
#      matched by source IP/CIDR. It says nothing about destinations.
#   2. Destination filter (`Filter` + `FilterDefaultDeny`) — which HOSTS
#      the proxy will connect *to*. This is the actual egress allowlist.
#
# Bifrost sits on the `internal` (no-default-route) Docker network and can
# reach the outside world only through this proxy, which straddles
# `internal` and `egress`.

# No User/Group directives: the container already runs as a non-root
# uid (compose `user:`), and tinyproxy cannot setuid when started
# non-root — the directives would make it error out at startup.

Listen 0.0.0.0
Port 8888

Timeout 30

# Keep logs to host/status only — never log full URLs (query strings can
# carry prompt content in some client libraries).
LogLevel Warning
DisableViaHeader Yes

# --- 1. Client ACL: only containers on the internal/24 subnet may use
# this proxy at all. This is NOT a destination allowlist.
Allow 10.77.0.0/24

# --- 2. Destination filter: the actual egress allowlist, matched against
# the CONNECT/request host. Deny-by-default — anything not matched by a
# pattern in the filter file is refused.
# Path is quoted: tinyproxy 1.11 requires string args in double quotes —
# unquoted it is a config *syntax error* and the proxy refuses to start.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
# tinyproxy 1.11 spelling: FilterType replaces the deprecated FilterExtended
FilterType ere
FilterCaseSensitive No

# CONNECT tunnels (used for HTTPS) may only target port 443.
ConnectPort 443
